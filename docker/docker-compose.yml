services:
  pgvector:
    image: paradedb/paradedb:latest
    container_name: pgvector
    ports:
      - "5400:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql

    environment:
       POSTGRES_PASSWORD: "5515"
       POSTGRES_USER: AHMED
       POSTGRES_DB: SecondMind
    networks:
      - Backend

    restart: always
  
  rag:
    image: rag:v10
    container_name: rag_engine
    ports:
      - "8000:8000"
    networks:
      - Backend

networks:
  Backend:

volumes:
  pgvector_data: